<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Deep Space 道具与设施陈列（Saltline 41 + Golden Hour 44）</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #e2eaef; font: 12px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #bar { position: fixed; left: 12px; top: 10px; z-index: 10; display: flex; gap: 8px; align-items: center; background: rgba(16,20,24,0.86); padding: 8px 12px; border-top: 2px solid #fff; }
  button { background: #1c242b; color: #e2eaef; border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; cursor: pointer; font: inherit; }
  button.active { background: #eef5f7; color: #101418; font-weight: 600; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels div { position: absolute; transform: translate(-50%, 0); white-space: nowrap; text-shadow: 0 1px 3px #000; font-size: 11px; color: #cfe3ec; }
</style>
<script type="importmap">
  { "imports": { "three": "../../vendor/three.module.js", "three/addons/": "../../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="bar">
  <button id="tab-sl" class="active">Saltline 工业道具 (41)</button>
  <button id="tab-gh">Golden Hour 室内陈设 (44)</button>
  <span id="summary"></span>
</div>
<div id="labels"></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createSaltlineMaterials } from '../../src/saltline/materials.js';
import { createSaltlineProps } from '../../src/saltline/props.js';
import { createGoldenHourFurniture } from '../../src/golden-hour/furniture.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161c22);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.65;
const sun = new THREE.DirectionalLight(0xfff1dc, 2.5);
sun.position.set(18, 32, 22);
scene.add(sun, new THREE.HemisphereLight(0x9fb8d4, 0x342c22, 0.65));

const slMats = createSaltlineMaterials({ renderer, params: { tex: 512, wet: 0 } });
const slProps = createSaltlineProps({ materials: slMats, palette: 'halcyon' });
const ghFurn = createGoldenHourFurniture({ anisotropy: 4 });

const group = new THREE.Group();
scene.add(group);
const labelsEl = document.getElementById('labels');
const labels = [];
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.2, 600);

function populate(mode) {
  group.clear();
  labelsEl.innerHTML = '';
  labels.length = 0;
  const lib = mode === 'sl' ? slProps : ghFurn;
  const names = lib.names;
  const cols = 7;
  const gap = mode === 'sl' ? 7.5 : 3.2;
  names.forEach((name, i) => {
    const x = (i % cols - (cols - 1) / 2) * gap;
    const z = Math.floor(i / cols) * gap;
    const obj = lib.create(name, { seed: i + 1 });
    const sz = obj.userData.size || [1, 1, 1];
    const maxDim = Math.max(sz[0], sz[1], sz[2], 0.01);
    const maxAllowed = gap * 0.72;
    if (maxDim > maxAllowed) obj.scale.setScalar(maxAllowed / maxDim);
    obj.position.set(x, 0, z);
    obj.rotation.y = 0.45;
    group.add(obj);
    const el = document.createElement('div');
    el.textContent = name;
    labelsEl.appendChild(el);
    labels.push([el, new THREE.Vector3(x, -0.35, z)]);
  });
  const rows = Math.ceil(names.length / cols);
  camera.position.set(0, rows * gap * 0.62, rows * gap * 1.15);
  camera.lookAt(0, 0, (rows - 1) * gap * 0.45);
  document.getElementById('summary').textContent = `${names.length} 种程序化模型（拖拽平移视角）`;
}

document.getElementById('tab-sl').onclick = (e) => {
  e.target.classList.add('active');
  document.getElementById('tab-gh').classList.remove('active');
  populate('sl');
};
document.getElementById('tab-gh').onclick = (e) => {
  e.target.classList.add('active');
  document.getElementById('tab-sl').classList.remove('active');
  populate('gh');
};
populate('sl');

const v = new THREE.Vector3();
function frame() {
  renderer.render(scene, camera);
  for (const [el, p] of labels) {
    v.copy(p).project(camera);
    el.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
    el.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
