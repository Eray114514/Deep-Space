<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saltline 材质陈列</title>
<!-- Dev page: every Saltline library material on a sphere and a box, lit by a
     sun + hemisphere sky. ?wet=0..1 sets rain wetness. Serve the repo root
     (npm run dev) and open /tools/saltline/material-gallery.html -->
<style>
  html, body { margin: 0; height: 100%; background: #101214; color: #d8dde2; font: 12px/1.3 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels div { position: absolute; transform: translate(-50%, 0); white-space: nowrap; text-shadow: 0 1px 2px #000; }
  #info { position: fixed; left: 12px; top: 10px; }
</style>
<script type="importmap">
  { "imports": { "three": "../../vendor/three.module.js", "three/addons/": "../../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="labels"></div>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createSaltlineMaterials } from '../../src/saltline/materials.js';

const qs = new URLSearchParams(location.search);
const wet = Number(qs.get('wet') || 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1e22);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
sun.position.set(4, 7, 5);
scene.add(sun, new THREE.HemisphereLight(0x9fb6d0, 0x3a3226, 0.6));

const t0 = performance.now();
const mats = createSaltlineMaterials({ renderer, params: { tex: 512, wet } });
const names = mats.names;
const cols = 8, gap = 2.4;
const sphere = new THREE.SphereGeometry(0.62, 48, 32);
const box = new THREE.BoxGeometry(0.8, 0.8, 0.8);
const labels = [];
names.forEach((name, i) => {
  const x = (i % cols - (cols - 1) / 2) * gap, z = Math.floor(i / cols) * gap * 0.9;
  const m = mats.get(name);
  const a = new THREE.Mesh(sphere, m); a.position.set(x - 0.45, 0.7, z);
  const b = new THREE.Mesh(box, m); b.position.set(x + 0.55, 0.45, z); b.rotation.y = 0.6;
  scene.add(a, b);
  const el = document.createElement('div'); el.textContent = name;
  document.getElementById('labels').appendChild(el);
  labels.push([el, new THREE.Vector3(x, -0.25, z)]);
});
const rows = Math.ceil(names.length / cols);
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, rows * 2.6, rows * gap * 0.9 + 6);
camera.lookAt(0, 0, rows * gap * 0.45);
renderer.compile(scene, camera);
const stats = mats.stats();
document.getElementById('info').textContent = `${names.length} 种材质 · ${stats.sets} 套纹理 · 烘焙 ${stats.genMs} ms · 显存约 ${stats.textureMB} MB · wet=${wet} · 总计 ${(performance.now() - t0).toFixed(0)} ms`;
window.__gallery = { names, stats, ready: false };
const v = new THREE.Vector3();
function frame() {
  renderer.render(scene, camera);
  for (const [el, p] of labels) {
    v.copy(p).project(camera);
    el.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
    el.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
  }
  window.__gallery.ready = true;
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
