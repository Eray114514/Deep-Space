<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Deep Space 武器库陈列（Saltline + Golden Hour）</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1216; color: #e6eef2; font: 13px/1.4 'Barlow Semi Condensed', system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #bar {
    position: fixed; left: 16px; top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: rgba(14, 18, 22, 0.85); border-top: 2px solid #fff; padding: 10px 14px; z-index: 10;
  }
  button {
    background: #1b2228; color: #e6eef2; border: 1px solid rgba(255,255,255,0.2);
    padding: 5px 10px; font: inherit; cursor: pointer; letter-spacing: 0.05em;
  }
  button.active { background: #eef5f7; color: #0e1216; font-weight: 600; }
  label { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; }
  #meta { position: fixed; left: 16px; bottom: 14px; color: #9fdbe8; letter-spacing: 0.06em; }
</style>
<script type="importmap">
  { "imports": { "three": "../../vendor/three.module.js", "three/addons/": "../../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="bar">
  <div id="slots"></div>
  <button id="btn-ads">开镜 ADS</button>
  <button id="btn-fire">连发 FIRE</button>
  <button id="btn-reload">战术换弹</button>
  <button id="btn-empty">空仓换弹</button>
  <button id="btn-holster">收/拔枪</button>
  <label>雨湿 <input id="rng-wet" type="range" min="0" max="1" step="0.05" value="0"></label>
</div>
<div id="meta">加载中…</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { SURFACE_WEAPONS } from '../../src/surface-weapons.js';
import { createSaltlineMaterials } from '../../src/saltline/materials.js';
import { SaltlineSfx } from '../../src/saltline/sfx.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141a20);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;
const sun = new THREE.DirectionalLight(0xfff2de, 2.8);
sun.position.set(3, 6, 4);
scene.add(sun, new THREE.HemisphereLight(0xa6c8e0, 0x2b241d, 0.75));

// Backdrop target grid for visual depth & live scope test
const grid = new THREE.GridHelper(60, 30, 0x3b5364, 0x22303a);
grid.position.y = -1.6;
scene.add(grid);
for (let i = -2; i <= 2; i++) {
  const pillar = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 2.4, 0.4),
    new THREE.MeshStandardMaterial({ color: i === 0 ? 0xd97a2b : 0x46545e, roughness: 0.5 }),
  );
  pillar.position.set(i * 3.5, -0.4, -18);
  scene.add(pillar);
}

const worldCam = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.01, 200);
const viewCam = new THREE.PerspectiveCamera(54, innerWidth / innerHeight, 0.01, 50);
scene.add(worldCam);

const fgScene = new THREE.Scene();
fgScene.environment = scene.environment;
fgScene.environmentIntensity = 0.9;
const fgSun = new THREE.DirectionalLight(0xfff2de, 2.8);
fgSun.position.set(3, 6, 4);
fgScene.add(fgSun, new THREE.HemisphereLight(0xa6c8e0, 0x2b241d, 0.85), viewCam);

const scopeCam = new THREE.PerspectiveCamera(4.2, 1, 0.05, 200);
const scopeRT = new THREE.WebGLRenderTarget(512, 512);
scopeRT.texture.colorSpace = THREE.LinearSRGBColorSpace;

const mats = createSaltlineMaterials({ renderer, params: { tex: 512, wet: 0 } });
const scaleMap = { anodized_black: 2, gunmetal: 2, brass: 4, glove_fabric: 3, rubber: 4 };

let audioCtx = null;
const sfx = new SaltlineSfx();
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      audioCtx = new AC();
      sfx.attach(audioCtx, audioCtx.destination, 0.5);
    }
  }
  if (audioCtx?.state === 'suspended') audioCtx.resume();
}

const vms = SURFACE_WEAPONS.map((def) => {
  const vm = def.create({
    camera: worldCam,
    viewCamera: viewCam,
    material: (name) => mats.get(name, { triplanar: true, vertexColors: true, scale: scaleMap[name] || 1 }),
    emit: (type, data) => {
      if (!audioCtx) return;
      if (type === 'weapon:fire') sfx.play(def.sfx?.shot || 'rifle_shot');
      else if (type === 'weapon:pump') sfx.play(data.phase === 'back' ? 'shotgun_pump_back' : 'shotgun_pump_fwd');
      else if (type === 'weapon:reload') {
        if (data.phase === 'shell') sfx.play('shotgun_shell');
        else if (data.phase === 'magout') sfx.play('reload_magout');
        else if (data.phase === 'magin') sfx.play('reload_magin');
        else if (data.phase === 'bolt') sfx.play(def.id === 'STRIX9' ? 'pistol_slide' : 'reload_bolt');
      }
    },
  });
  vm.root.visible = false;
  if (def.hasScope && vm.opticGlass?.material) {
    vm.opticGlass.material.map = scopeRT.texture;
    if (vm.opticGlass.material.uniforms?.tScope) vm.opticGlass.material.uniforms.tScope.value = scopeRT.texture;
  }
  viewCam.add(vm.root);
  return vm;
});

let cur = 0;
let ads = false;
let firing = false;
const slotsEl = document.getElementById('slots');
SURFACE_WEAPONS.forEach((def, i) => {
  const b = document.createElement('button');
  b.textContent = `${i + 1} ${def.short}`;
  b.onclick = () => { ensureAudio(); select(i); };
  slotsEl.appendChild(b);
});

function select(i) {
  vms[cur].root.visible = false;
  cur = i;
  vms[cur].reset();
  vms[cur].root.visible = true;
  vms[cur].draw();
  viewCam.fov = SURFACE_WEAPONS[cur].viewFov;
  viewCam.updateProjectionMatrix();
  [...slotsEl.children].forEach((b, idx) => b.classList.toggle('active', idx === cur));
}
select(1);
for (let i = 0; i < 65; i++) {
  vms[cur].update(1 / 60, { fire: false, ads: false, reload: false, speed: 0, onGround: true });
}

document.getElementById('btn-ads').onclick = (e) => { ensureAudio(); ads = !ads; e.target.classList.toggle('active', ads); };
const fireBtn = document.getElementById('btn-fire');
fireBtn.onmousedown = () => { ensureAudio(); firing = true; };
window.addEventListener('mouseup', () => { firing = false; });
document.getElementById('btn-reload').onclick = () => { ensureAudio(); if (vms[cur].ammo >= vms[cur].magSize) vms[cur].ammo--; vms[cur].reloadNow(); };
document.getElementById('btn-empty').onclick = () => { ensureAudio(); vms[cur].ammo = 0; vms[cur].reloadNow(); };
document.getElementById('btn-holster').onclick = () => { ensureAudio(); const v = vms[cur]; if (v.isHolstered()) v.draw(); else v.holster(); };
document.getElementById('rng-wet').oninput = (e) => {
  const w = Number(e.target.value);
  mats.uniforms.wet.value = w;
  vms.forEach((v) => v.setWetness(w));
};

window.__arsenalGallery = { vms, select, ready: false };
let last = performance.now();
function loop(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  const def = SURFACE_WEAPONS[cur];
  const vm = vms[cur];
  vm.update(dt, { fire: firing, ads, reload: false, speed: 0, onGround: true, sprinting: false, crouching: false });

  if (def.hasScope && vm.opticGlass) {
    vm.root.visible = false;
    scopeCam.position.set(0, 0, 0);
    renderer.setRenderTarget(scopeRT);
    renderer.clear();
    renderer.render(scene, scopeCam);
    renderer.setRenderTarget(null);
    vm.root.visible = true;
  }

  renderer.autoClear = true;
  renderer.render(scene, worldCam);
  renderer.autoClear = false;
  renderer.clearDepth();
  renderer.render(fgScene, viewCam);

  document.getElementById('meta').textContent =
    `${def.name} · 弹药 ${vm.ammo}/${vm.magSize} · 状态 ${vm.equipState()} (${vm.state}) · 三角面 ${vm.info.tris.toLocaleString()}`;
  window.__arsenalGallery.ready = true;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
